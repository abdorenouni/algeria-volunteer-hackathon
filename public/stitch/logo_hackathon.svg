  <text x="305" y="104" font-family="'Cairo', 'Tajawal', sans-serif" font-size="11" font-weight="500" fill="#D21034" text-anchor="end">19 - 20 سبتمبر 2026 • مؤسسات الشباب فضاءات للابتكار والتطوع</text>
