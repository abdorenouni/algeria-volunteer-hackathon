    <path d="M48 22 A 20 20 0 1 0 48 58 A 16 16 0 1 1 48 22 Z" fill="#FFFFFF"/>
    <path d="M48 22 A 20 20 0 1 0 48 58 A 16 16 0 1 1 48 22 Z" fill="#D21034" transform="scale(0.85) translate(8, 7)"/>
    <!-- Volunteer Sparkle / Hands Icon in White -->
    <path d="M40 32 L42 38 L48 40 L42 42 L40 48 L38 42 L32 40 L38 38 Z" fill="#FFFFFF"/>
